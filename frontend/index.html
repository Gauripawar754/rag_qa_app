<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Document Q&A</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #e8eef3;
    --surface:    #0e1923;
    --border:     #1e2329;
    --border-hi:  #2e3540;
    --accent:     #00e5a0;
    --accent-dim: #00e5a022;
    --accent-glow:#00e5a044;
    --red:        #ff4d6d;
    --red-dim:    #ff4d6d18;
    --text:       #d4dae4;
    --text-muted: #5a6478;
    --text-dim:   #8a95a8;
    --mono:       'JetBrains Mono', monospace;
    --sans:       'Syne', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.4;
    pointer-events: none;
    display: none;
    z-index: 0;
  }

  .shell {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-hi);
    padding-bottom: 20px;
  }
  .logo {
    font-family: var(--sans);
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #0c0b0b;
  }
  .logo span { color: var(--accent); }
  .badge {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    border: 1px solid var(--border-hi);
    padding: 4px 10px;
    border-radius: 2px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }
  .panel:nth-child(2) { animation-delay: 0.05s; }
  .panel:nth-child(3) { animation-delay: 0.12s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: #0e1114;
  }
  .panel-num {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid var(--accent-glow);
    border-radius: 2px;
    padding: 2px 7px;
    letter-spacing: 1px;
  }
  .panel-title {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #e8edf5;
  }
  .panel-body { padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; }

  label {
    display: block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 7px;
  }


  .dropzone {
    border: 1.5px dashed var(--border-hi);
    border-radius: 4px;
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .dropzone:hover, .dropzone.dragging {
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .dropzone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .dropzone-icon { font-size: 28px; margin-bottom: 8px; }
  .dropzone-text { color: var(--text-dim); font-size: 12px; }
  .dropzone-text strong { color: var(--accent); font-weight: 500; }
  .file-selected {
    margin-top: 6px;
    font-size: 11px;
    color: var(--accent);
    display: none;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    border-radius: 3px;
    border: 1px solid transparent;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #001a10;
    border-color: var(--accent);
  }
  .btn-primary:hover { filter: brightness(1.12); }
  .btn-primary:disabled {
    background: var(--border-hi);
    color: var(--text-muted);
    border-color: var(--border-hi);
    cursor: not-allowed;
    filter: none;
  }
  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    border-color: var(--border-hi);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .input-wrap { position: relative; }
  textarea, input[type="text"] {
    width: 100%;
    background: #0b0d0f;
    border: 1px solid var(--border-hi);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px 14px;
    outline: none;
    resize: vertical;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  textarea:focus, input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  textarea { min-height: 80px; }

  .row { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
    
  #chunksRow {
    display: none;
  }
    
  .status-box {
    border-radius: 4px;
    padding: 12px 16px;
    font-size: 12px;
    display: none;
    border: 1px solid;
    line-height: 1.7;
  }
  .status-box.success {
    background: #001a10;
    border-color: var(--accent);
    color: var(--accent);
  }
  .status-box.error {
    background: var(--red-dim);
    border-color: var(--red);
    color: var(--red);
  }
  .status-box.visible { display: block; }

  .answer-block {
    display: none;
    flex-direction: column;
    gap: 12px;
    animation: fadeUp 0.3s ease;
  }
  .answer-block.visible { display: flex; }

  .answer-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 500;
  }

  .answer-text {
    background: #0b0d0f;
    border: 1px solid var(--border-hi);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 16px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
  }



  .chunks-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chunks-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-muted);
  }
  .chunk-tag {
    font-size: 11px;
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid var(--accent-glow);
    border-radius: 2px;
    padding: 2px 8px;
  }

  .spinner-wrap {
    display: none;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 12px;
  }
  .spinner-wrap.visible { display: flex; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border-hi);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

 


</style>


</head>
<body>
<div class="shell">

  <header>
    <div class="logo">Document<span>.</span>QA</div>
    <!-- <div class="badge"></div> -->
  </header>

  
  <div class="panel" id="uploadPanel">
    <div class="panel-header">
      <!-- <span class="panel-num"></span> -->
      <span class="panel-title">Upload Document</span>
    </div>
    <div class="panel-body">
      <div>
        <label>Select a .txt file</label>
        <div class="dropzone" id="dropzone">
          <input type="file" id="fileInput" accept=".txt" />
          <div class="dropzone-icon">📄</div>
          <div class="dropzone-text">
            <strong>Click to browse</strong> or drag & drop<br/>
            Only <strong>.txt</strong> files accepted
          </div>
          <div class="file-selected" id="fileSelected"></div>
        </div>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="uploadBtn" disabled>
          ⬆ Upload &amp; Index
        </button>
        <button class="btn btn-ghost" id="clearBtn">✕ Clear</button>
      </div>
      <div class="status-box" id="uploadStatus"></div>
    </div>
  </div>


  <div class="panel" id="qaPanel">
    <div class="panel-header">
      <!-- <span class="panel-num"></span> -->
      <span class="panel-title">Ask a Question</span>
    </div>
    <div class="panel-body">
      <div>
        <label>Your question</label>
        <textarea id="questionInput" placeholder="e.g. What is the main topic of this document?"></textarea>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="askBtn" disabled>
          ◆ Ask
        </button>
      </div>

      <div class="spinner-wrap" id="spinner">
        <div class="spinner"></div>
        <span>Analyzing your document and generating an answer…</span>
      </div>

      <div class="status-box" id="qaStatus"></div>

      <div class="answer-block" id="answerBlock">
        <div class="answer-label">Answer</div>
        <div class="answer-text" id="answerText"></div>
        <div class="chunks-row" id="chunksRow">
          <!-- <span class="chunks-label">Source chunks:</span> -->
            </div>
      </div>
    </div>
  </div>

</div>

<script>

function show(el, cls, msg) {
  el.className = 'status-box ' + cls + ' visible';
  el.textContent = msg;
}
function hide(el) {
  el.className = 'status-box';
  el.textContent = '';
}

let documentId = null;


const fileInput    = document.getElementById('fileInput');
const fileSelected = document.getElementById('fileSelected');
const uploadBtn    = document.getElementById('uploadBtn');
const clearBtn     = document.getElementById('clearBtn');
const uploadStatus = document.getElementById('uploadStatus');
const dropzone     = document.getElementById('dropzone');

const questionInput = document.getElementById('questionInput');
const askBtn        = document.getElementById('askBtn');
const spinner       = document.getElementById('spinner');
const qaStatus      = document.getElementById('qaStatus');
const answerBlock   = document.getElementById('answerBlock');
const answerText    = document.getElementById('answerText');
const chunksRow     = document.getElementById('chunksRow');


fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (f) {
    fileSelected.textContent = '✔ ' + f.name;
    fileSelected.style.display = 'block';
    uploadBtn.disabled = false;
    hide(uploadStatus);
  }
});


dropzone.addEventListener('dragover', e => {
  e.preventDefault();
  dropzone.classList.add('dragging');
});

dropzone.addEventListener('dragleave', () => {
  dropzone.classList.remove('dragging');
});

dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragging');

  const f = e.dataTransfer.files[0];

  if (f && f.name.endsWith('.txt')) {
    fileInput.files = e.dataTransfer.files;
    fileSelected.textContent = '✔ ' + f.name;
    fileSelected.style.display = 'block';
    uploadBtn.disabled = false;
    hide(uploadStatus);
  } else {
    show(uploadStatus, 'error', '✕ Only .txt files allowed');
  }
});


clearBtn.addEventListener('click', () => {
  fileInput.value = '';
  fileSelected.style.display = 'none';
  fileSelected.textContent = '';

  uploadBtn.disabled = true;
  askBtn.disabled = true;

  documentId = null;

  hide(uploadStatus);
  hide(qaStatus);

  answerBlock.classList.remove('visible');
  answerText.textContent = '';

  chunksRow.innerHTML = '<span class="chunks-label">Source chunks:</span>';
});


uploadBtn.addEventListener('click', async () => {
  const f = fileInput.files[0];

  if (!f) return;

  if (!f.name.endsWith('.txt')) {
    show(uploadStatus, 'error', '✕ Only .txt files allowed');
    return;
  }

  const formData = new FormData();
  formData.append("file", f);

  show(uploadStatus, '', '⏳ Uploading...');

  try {
    const res = await fetch("http://127.0.0.1:8000/upload", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data.detail);

    documentId = data.document_id;

    show(
      uploadStatus,
      'success',
      `✔ ${data.filename} indexed (${data.total_chunks} chunks)`
    );

    askBtn.disabled = false;

  } catch (err) {
    show(uploadStatus, 'error', '✕ ' + err.message);
  }
});


function resetAnswer() {
  answerBlock.classList.remove('visible');
  answerText.textContent = '';
  hide(qaStatus);
  spinner.classList.remove('visible');

  chunksRow.innerHTML = '<span class="chunks-label">Source chunks:</span>';
}


askBtn.addEventListener('click', async () => {
  const question = questionInput.value.trim();

  if (!question) {
    show(qaStatus, 'error', '✕ Enter a question');
    return;
  }

  if (!documentId) {
    show(qaStatus, 'error', '✕ Upload document first');
    return;
  }

  resetAnswer();
  spinner.classList.add('visible');
  askBtn.disabled = true;

  try {
    const res = await fetch("http://127.0.0.1:8000/ask", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        document_id: documentId,
        question: question
      })
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data.detail);

    spinner.classList.remove('visible');

    answerText.textContent = data.answer;

    chunksRow.innerHTML = '<span class="chunks-label">Source chunks:</span>';

    data.sources.forEach((s, i) => {
      const tag = document.createElement('span');
      tag.className = 'chunk-tag';
      tag.textContent = `#${i + 1}`;
      tag.title = s.content; 
      chunksRow.appendChild(tag);
    });

    answerBlock.classList.add('visible');
    askBtn.disabled = false;

  } catch (err) {
    spinner.classList.remove('visible');
    show(qaStatus, 'error', '✕ ' + err.message);
    askBtn.disabled = false;
  }
});


questionInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    askBtn.click();
  }
});

</script>

</body>
</html>
