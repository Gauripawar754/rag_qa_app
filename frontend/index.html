<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Document Q&A</title>
<link rel ="stylesheet" href="static/style.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>


</head>
<body>
<div class="shell">

  <header>
    <div class="logo">Document<span>.</span>QA</div>
    <!-- <div class="badge"></div> -->
  </header>

  
  <div class="panel" id="uploadPanel">
    <div class="panel-header">
      <!-- <span class="panel-num"></span> -->
      <span class="panel-title">Upload Document</span>
    </div>
    <div class="panel-body">
      <div>
        <label>Select a .txt file</label>
        <div class="dropzone" id="dropzone">
          <input type="file" id="fileInput" accept=".txt" />
          <div class="dropzone-icon">📄</div>
          <div class="dropzone-text">
            <strong>Click to browse</strong> or drag & drop<br/>
            Only <strong>.txt</strong> files accepted
          </div>
          <div class="file-selected" id="fileSelected"></div>
        </div>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="uploadBtn" disabled>
          ⬆ Upload &amp; Index
        </button>
        <button class="btn btn-ghost" id="clearBtn">✕ Clear</button>
      </div>
      <div class="status-box" id="uploadStatus"></div>
    </div>
  </div>


  <div class="panel" id="qaPanel">
    <div class="panel-header">
      <!-- <span class="panel-num"></span> -->
      <span class="panel-title">Ask a Question</span>
    </div>
    <div class="panel-body">
      <div>
        <label>Your question</label>
        <textarea id="questionInput" placeholder="e.g. What is the main topic of this document?"></textarea>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="askBtn" disabled>
          ◆ Ask
        </button>
      </div>

      <div class="spinner-wrap" id="spinner">
        <div class="spinner"></div>
        <span>Analyzing your document and generating an answer…</span>
      </div>

      <div class="status-box" id="qaStatus"></div>

      <div class="answer-block" id="answerBlock">
        <div class="answer-label">Answer</div>
        <div class="answer-text" id="answerText"></div>
        <div class="chunks-row" id="chunksRow">
          <!-- <span class="chunks-label">Source chunks:</span> -->
            </div>
      </div>
    </div>
  </div>

</div>
<script src="static/script.js"></script>

</body>
</html>
